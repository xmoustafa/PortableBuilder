; ============================================================
;  PortableLauncher configuration
;  Paths are relative to the EXE folder unless they are absolute.
;  Environment variables such as %LOCALAPPDATA% are supported.
; ============================================================

[App]
; Shown only in the log.
Name=My App Portable

; Junction = mklink /J (no admin needed, same/local NTFS volume)
; Symlink  = CreateSymbolicLink (needs admin or Developer Mode, can cross volumes)
LinkType=Symlink

; Relaunch with a UAC prompt when not elevated.
; Needed for: HKLM registry import, Windows services, Program Files links.
RequireAdmin=1

; 1 = no message boxes, errors go to the log only (recommended for silent run).
Silent=1

; Log file, relative to the EXE folder. Leave empty to disable logging
; (the builder generates silent packages with LogFile=).
LogFile=

; 1 = launcher stays alive and waits for the started programs.
WaitForExit=0

; 1 = remove the links and put the original folders back after the app exits.
; Only works together with WaitForExit=1.
RestoreOnExit=0

; Optional: wait for this process name to disappear before cleanup.
; Useful for apps whose launcher exe exits immediately (bootstrap).
; WaitProcess=MyAppEngine
; How long to wait for it to appear before giving up (ms).
WaitProcessGraceMs=15000

; Extra wait before starting the program (ms).
DelayMs=2000

[Folders]
; real system folder = portable folder
%LOCALAPPDATA%\MyApp=MyAppData\AppData\Local
%APPDATA%\MyApp=MyAppData\AppData\Roaming
%ProgramData%\MyApp=MyAppData\ProgramData
%ProgramFiles%\MyApp=MyAppData\ProgramFiles
%ProgramFiles(x86)%\MyApp=MyAppData\ProgramFiles(x86)

[CopyFolders]
; real folder = portable folder (copied instead of linked; works on FAT32/exFAT)
; %LOCALAPPDATA%\MyApp=Data\Copy\AppDataLocal\MyApp

[Overlay]
; real root = portable folder with individual files to copy in/out
; %LOCALAPPDATA%=Data\Overlay\AppDataLocal

[Registry]
; id = .reg file
main=MyAppData\Regs\MyApp.reg

[RegistryExport]
; key = .reg file to export on exit (persists settings inside the package)
; HKCU\Software\MyApp=Regs\export_0.reg

[Services]
; name = binPath | display name | description
; binPath keeps the normal hard-coded path; the link makes it resolve
; inside MyAppData, exactly like the original launcher does.
MyAppService="C:\Program Files\MyApp\MyAppService.exe" --run-as-service|My App Service|My App background service.

[Run]
; exe path = arguments
C:\Program Files\MyApp\MyApp.exe=
